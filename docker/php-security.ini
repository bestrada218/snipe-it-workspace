; Hardening against the PHP security release of 19 November 2026.
;
; CVE-2026-115560 and CVE-2026-126714 corrupt or inject session data through
; the session upload progress feature. Snipe-IT keeps its sessions in Laravel,
; not in native PHP sessions, so turning the feature off changes nothing for
; users. It must be set here (php.ini / conf.d), never with ini_set().
session.upload_progress.enabled = Off

; Defense in depth recommended by the same advisories: never expose call
; arguments in backtraces, and keep OPcache on (it keeps CVE-2026-129481
; unreachable).
zend.exception_ignore_args = On
opcache.enable = 1
expose_php = Off

; Remove this file's upload-progress line only after the PHP packages are
; patched (upstream 8.3.37 / 8.4.28, or the distribution backport).
