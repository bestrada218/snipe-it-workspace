# Snipe-IT Workspace production compose: the image is BUILT FROM THIS REPOSITORY,
# so it carries every customisation (the stock docker-compose.yml pulls the
# official snipe/snipe-it image, which does not).
#
# First install:   scripts/workspace-install.sh
# Updates:         scripts/workspace-update.sh
name: snipe-it-workspace

volumes:
  db_data:
  storage:

services:
  app:
    build: .
    image: snipe-it-workspace:latest
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
