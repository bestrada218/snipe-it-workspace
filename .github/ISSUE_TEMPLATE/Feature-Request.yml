name: Feature Request
description: Suggest an improvement for Snipe-IT Workspace.
title: "[Feature]: "
type: feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need to do?
      description: Describe the task or problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
