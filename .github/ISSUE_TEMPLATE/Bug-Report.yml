name: Bug Report
description: Something in Snipe-IT Workspace does not work as expected.
title: "[Bug]: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with **Snipe-IT Workspace**.

        - If it also happens in the original Snipe-IT (not in a feature this project adds), it is better reported to [Snipe-IT](https://github.com/grokability/snipe-it/issues).
        - **Do not include passwords, keys, the `.env` file or real people's data** in text, screenshots or videos.
        - For security problems, do not open an issue: see the [security policy](https://github.com/bestrada218/snipe-it-workspace/security/policy).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `snipe-it-workspace status` (first line), or the commit you are running.
      placeholder: "Version: 5aa90f7491  2026-11-20  ..."
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How was it installed?
      options:
        - One-command installer (workspace-setup.sh)
        - Docker with compose.workspace.yml
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `snipe-it-workspace logs`. Remove anything sensitive.
      render: shell
